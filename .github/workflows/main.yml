    - "build"
    - "repos"
    "runs-on": "ubuntu-latest"
    "steps":
    - "uses": "actions/checkout@v4"
    - "id": "filter"
      "if": "github.event_name != 'workflow_dispatch'"
      "uses": "dorny/paths-filter@v3"
      "with":
        "filters": |
          workflows:
            - '.github/**'
            - 'bin/**'
            - 'Dockerfile'
            - 'go.mod'
            - 'go.sum'
            - 'jsonnet/**'
            - 'main.go'
            - 'Makefile'
            - 'pkg/**'
            - 'scripts/**'
            - 'tf/**'
            - 'libs/actions-runner-controller/**'
    - "if": "steps.filter.outputs.workflows == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.libs == 'all' || contains(format(',{0},', inputs.libs), ',actions-runner-controller,')))"
      "uses": "actions/download-artifact@v4"
      "with":
        "name": "docker-artifact"
        "path": "artifacts"
    - "if": "steps.filter.outputs.workflows == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.libs == 'all' || contains(format(',{0},', inputs.libs), ',actions-runner-controller,')))"
